<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>مدرستك - كلمات الإنجليزية</title>
<!-- Google Fonts: Tajawal (Arabic) & Plus Jakarta Sans (English) -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            tajawal: ['Tajawal', 'sans-serif'],
            jakarta: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            navy: {
              900: '#0c1a30',
              800: '#112240',
              700: '#1d3257',
            },
            brand: {
              blue: '#2962ff',
              lightBlue: '#e8f0fe',
              hoverBlue: '#1e4fd9',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: "Plus Jakarta Sans", 'Tajawal', sans-serif;
    }
    .font-en {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Wavy flowing multi-color gradient background for Hero Card */
    .hero-wavy-gradient {
      background: radial-gradient(circle at 10% 20%, rgba(224, 242, 254, 0.95) 0%, rgba(238, 242, 255, 0.85) 45%, rgba(243, 232, 255, 0.8) 100%),
                  linear-gradient(135deg, #dbeafe 0%, #e0e7ff 40%, #ede9fe 70%, #ccfbf1 100%);
    }
    .wavy-blob-1 {
      position: absolute;
      top: -40%;
      left: -20%;
      width: 60%;
      height: 180%;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.35) 0%, rgba(199, 210, 254, 0.2) 60%, transparent 80%);
      filter: blur(40px);
      pointer-events: none;
    }
    .wavy-blob-2 {
      position: absolute;
      bottom: -40%;
      right: -10%;
      width: 55%;
      height: 160%;
      background: radial-gradient(circle, rgba(196, 181, 253, 0.3) 0%, rgba(167, 243, 208, 0.25) 60%, transparent 80%);
      filter: blur(45px);
      pointer-events: none;
    }
</style>
</head>
<body class="bg-[#f0f4fa] text-slate-800 antialiased min-h-screen flex selection:bg-blue-200">
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col min-h-screen px-7 py-6 overflow-y-auto" id="vocab-app" data-mode="{{ mode }}" data-record="{% url 'student:vocab_record' t.teacher_code %}" data-csrf="{{ csrf_token }}">
<!-- BEGIN: NavigationTabs -->
<div class="bg-white rounded-2xl p-1.5 flex items-center justify-between max-w-xl mx-auto w-full shadow-sm mb-6 border border-slate-100" data-purpose="segment-tabs">
<a href="?mode=review{% if lid %}&amp;lesson={{ lid|urlencode }}{% endif %}" class="flex-1 py-2.5 text-center text-sm font-bold {% if mode == 'review' %}text-blue-600 bg-blue-100/70 rounded-xl transition-all relative{% else %}text-slate-400 hover:text-slate-700 rounded-xl transition-all{% endif %}">
        كلمات للمراجعة{% if mode == 'review' %}
<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-4 h-0.5 bg-blue-600 rounded-full"></span>{% endif %}
</a>
<a href="?mode=test{% if lid %}&amp;lesson={{ lid|urlencode }}{% endif %}" class="flex-1 py-2.5 text-center text-sm font-bold {% if mode == 'test' %}text-blue-600 bg-blue-100/70 rounded-xl transition-all relative{% else %}text-slate-400 hover:text-slate-700 rounded-xl transition-all{% endif %}">
        الاختبار{% if mode == 'test' %}
<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-4 h-0.5 bg-blue-600 rounded-full"></span>{% endif %}
</a>
<a href="?mode=practice{% if lid %}&amp;lesson={{ lid|urlencode }}{% endif %}" class="flex-1 py-2.5 text-center text-sm font-bold {% if mode == 'practice' %}text-blue-600 bg-blue-100/70 rounded-xl transition-all relative{% else %}text-slate-400 hover:text-slate-700 rounded-xl transition-all{% endif %}">
        التدريب{% if mode == 'practice' %}
<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-4 h-0.5 bg-blue-600 rounded-full"></span>{% endif %}
</a>
<!-- Active Tab -->
<a href="?mode=learn{% if lid %}&amp;lesson={{ lid|urlencode }}{% endif %}" class="flex-1 py-2.5 text-center text-sm font-bold {% if mode == 'learn' %}text-blue-600 bg-blue-100/70 rounded-xl transition-all relative{% else %}text-slate-400 hover:text-slate-700 rounded-xl transition-all{% endif %}">
        التعليم{% if mode == 'learn' %}
<span class="absolute bottom-1 left-1/2 -translate-x-1/2 w-4 h-0.5 bg-blue-600 rounded-full"></span>{% endif %}
</a>
</div>
<!-- END: NavigationTabs -->
<!-- BEGIN: HeroCard -->
<section class="relative hero-wavy-gradient border border-blue-200/70 rounded-3xl p-7 md:p-8 mb-7 shadow-md shadow-blue-500/5 overflow-hidden backdrop-blur-sm" data-purpose="featured-vocabulary-card" id="hero">
<!-- Subtle wavy luminous background blobs -->
<div class="wavy-blob-1"></div>
<div class="wavy-blob-2"></div>
<svg class="absolute inset-0 w-full h-full opacity-20 pointer-events-none" preserveAspectRatio="none" viewBox="0 0 800 300">
<path d="M0,96L48,112C96,128,192,160,288,154.7C384,149,480,107,576,101.3C672,96,768,128,816,144L864,160L864,320L816,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" fill="url(#waveGrad)"></path>
<defs>
<linearGradient id="waveGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#93c5fd"></stop>
<stop offset="50%" stop-color="#c4b5fd"></stop>
<stop offset="100%" stop-color="#a7f3d0"></stop>
</linearGradient>
</defs>
</svg>
<div class="relative z-10 flex flex-col justify-between min-h-[210px]" id="hero-body"></div>
</section>
<!-- END: HeroCard -->
<!-- BEGIN: WordCardsSection -->
<section class="space-y-4 hidden" data-purpose="vocabulary-grid-section" id="cards-section">
<div class="flex items-center justify-between">
<h3 class="text-lg font-extrabold text-navy-900 font-tajawal" id="cards-title">جميع الكلمات</h3>
<span class="text-xs text-slate-400 font-medium" id="cards-count"></span>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="cards-grid"></div>
</section>
<!-- END: WordCardsSection -->
</main>
<!-- END: MainContent -->
{{ data|json_script:"vocab-data" }}
<script>
(function(){
  var root = document.getElementById('vocab-app');
  var mode = root.getAttribute('data-mode');
  var recordUrl = root.getAttribute('data-record');
  var csrf = root.getAttribute('data-csrf') || '';
  var words = JSON.parse(document.getElementById('vocab-data').textContent) || [];
  var heroBody = document.getElementById('hero-body');
  var hero = document.getElementById('hero');
  var cardsSection = document.getElementById('cards-section');
  var cardsTitle = document.getElementById('cards-title');
  var cardsCount = document.getElementById('cards-count');
  var cardsGrid = document.getElementById('cards-grid');

  /* ---------- أدوات ---------- */
  var ICON_LISTEN = 'https://lh3.googleusercontent.com/aida-public/AB6AXuDeePl_8Fu_bGa8oW33nfiZdms80PwOkuoE9RUZFJVDL4u6ZdaHlgDBJqCuyYKB-1S6vVVBMTuzsttOkys697UXokttPWBFQGaWnZQbBg2J68ZufTk1YjRTb8tghfpqGPloGmoTdKO4NK90gpmJbAefGvUgCqYqvkuotedC0geF0GlkansXPaiZKEJBy3tj362dIZ6rxPEjyeCtatlGj-tLjCZ7pf7Tf2EXfvgCntSnreFUIdT___k62ntI3uhyVDJLrA';
  var ICON_HEADPHONES = 'https://lh3.googleusercontent.com/aida-public/AB6AXuCj2yBoldIcW2cf3GIFgwCnqoB8x5KTB6Jqw8ZfJ4KikZ67fNTTlX5ZNHqbyg_NfWJv63uhXQJAPVa7f_7KrzXz3CiNsgejLAPTDqSaCVWcxHGu3lXM5nGpSGbMchpd_HjhY8LQos98oZBHBvHRPCWjFvvWISwC06ntX6RH0dp3wLSxJDWTS8dsee9G2ZCU3PR_O3-wowo1WaEsez-JI9rxNPktQtghTJxVFp1hXYvXNFPwMmjGX5WTYq3-Re8F4RXAbw';
  var ICON_CARD = 'https://lh3.googleusercontent.com/aida-public/AB6AXuB6c8X31bVQkkV9nPZvjIfos371U96WWMHK48_3ywFs_J7M5tJMj_nHJ6lWXY4dzlkxbXNOPBZOC7wgzv1ENo5fWuhavHRsCIYsZrI8KJ_llU4W57HGxtzztyGqNb_Jo8Y0oC-ruo-9-rQyxME1Ku_jhCmk1lWz01l-GdJs0WoTCaM7kdMNHDpJgcQzsRsPBVtdnZYoKWZn-j1iK35PpYWMhu9W7GQ_dzY_aOzHFVws270Hq-b0PuUFX0n44p3yZdDD0w';

  var LV = {
    easy:   {card:'سهل',   hero:'سهلة',   badge:'bg-emerald-100 text-emerald-700', pill:'bg-emerald-100/90 text-emerald-700 border-emerald-200/50', icon:'text-emerald-500', bar:'bg-emerald-400'},
    medium: {card:'متوسط', hero:'متوسطة', badge:'bg-amber-100 text-amber-700',     pill:'bg-amber-100/90 text-amber-700 border-amber-200/50',       icon:'text-amber-500',   bar:'bg-amber-400'},
    hard:   {card:'صعب',   hero:'صعبة',   badge:'bg-rose-100 text-rose-700',       pill:'bg-rose-100/90 text-rose-700 border-rose-200/50',         icon:'text-rose-500',    bar:'bg-rose-400'}
  };
  function lv(w){ return LV[w.level] || LV.medium; }

  function esc(s){ var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function shuffle(a){ a = a.slice(); for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = a[k]; a[k] = a[j]; a[j] = t; } return a; }
  function speak(t){
    if (!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  function pct(p){ return Math.max(0, Math.min(100, p)); }

  /* تمييز الكلمة داخل جملة المثال */
  function highlight(sentence, word){
    var base = (word || '').trim(), cands = [base];
    if (base.length > 4) cands.push(base.slice(0, -1));
    if (base.length > 5) cands.push(base.slice(0, -2));
    for (var c = 0; c < cands.length; c++) {
      var m = new RegExp('\\b' + escRe(cands[c]) + '[A-Za-z]*', 'i').exec(sentence);
      if (m) {
        return esc(sentence.slice(0, m.index))
          + '<span class="font-bold text-blue-600 underline decoration-blue-300 decoration-2 underline-offset-4">' + esc(m[0]) + '</span>'
          + esc(sentence.slice(m.index + m[0].length));
      }
    }
    return esc(sentence);
  }

  /* ---------- قطع التصميم (نفس الـ markup الأصلي) ---------- */
  function listenIconBtn(word){
    return '<button class="bg-white/80 hover:bg-white p-2 rounded-2xl shadow-xs border border-blue-200/60 transition-all hover:scale-105" title="استمع للنطق" type="button" data-speak="' + esc(word) + '">'
      + '<img alt="Listen" class="w-6 h-6 object-contain" src="' + ICON_LISTEN + '"></button>';
  }
  function pill(text, L){
    return '<div class="flex items-center gap-2 ' + L.pill + ' px-5 py-2.5 rounded-full text-sm font-bold shadow-sm border"><span class="">' + esc(text) + '</span>'
      + '<svg class="w-4 h-4 ' + L.icon + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg></div>';
  }
  function bigWord(text, cls){
    return '<span class="text-4xl sm:text-5xl font-extrabold text-[#1d4ed8] tracking-tight ' + (cls || 'font-en font-jakarta') + ' drop-shadow-sm">' + esc(text) + '</span>';
  }
  function progressPill(label, percent){
    return '<div class="flex items-center gap-3 bg-white/70 backdrop-blur-xs px-3.5 py-1.5 rounded-full border border-blue-100">'
      + '<div class="w-32 bg-blue-100 rounded-full h-2 overflow-hidden flex"><div class="bg-emerald-400 h-2 rounded-full shadow-xs" style="width: ' + pct(percent) + '%"></div></div>'
      + '<span class="text-xs font-bold text-slate-500 font-en font-jakarta">' + esc(label) + '</span></div>';
  }
  var BTN_CLS = 'inline-flex items-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-base font-bold px-7 py-3.5 rounded-full shadow-md shadow-blue-500/25 transition-all hover:shadow-lg hover:shadow-blue-500/30 hover:-translate-y-0.5';
  function heroTitle(text){ return '<h2 class="text-2xl sm:text-3xl font-extrabold text-navy-900 tracking-normal font-tajawal">' + esc(text) + '</h2>'; }

  function wordCard(w, idx, clickable){
    var L = lv(w), p = w.progress || 0;
    return '<div ' + (clickable ? 'data-idx="' + idx + '" role="button" tabindex="0" ' : '')
      + 'class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm flex flex-col justify-between hover:shadow-md hover:border-blue-200 transition-all group' + (clickable ? ' cursor-pointer' : '') + '">'
      + '<div><div class="flex items-center justify-between mb-2">'
      + '<button class="bg-blue-50 hover:bg-blue-100 p-2 rounded-xl transition-colors shrink-0" title="استمع" type="button" data-speak="' + esc(w.word) + '"><img alt="Audio" class="w-5 h-5 object-contain" src="' + ICON_CARD + '"></button>'
      + '<span class="text-2xl font-extrabold text-navy-900 font-en font-jakarta tracking-tight text-left" dir="ltr">' + esc(w.word) + '</span></div>'
      + '<div class="space-y-1.5 mt-2"><p class="text-base font-bold text-slate-800 font-tajawal">' + esc(w.meaning) + '</p>'
      + (w.example ? '<p class="text-sm text-slate-500 font-medium font-en font-jakarta text-left" dir="ltr">' + esc(w.example) + '</p>' : '') + '</div></div>'
      + '<div class="flex items-center justify-between mt-5 pt-3 border-t border-slate-100">'
      + '<span class="px-5 py-2 rounded-full text-sm font-bold ' + L.badge + ' shadow-xs">' + L.card + '</span>'
      + '<div class="flex items-center gap-2"><div class="w-20 bg-slate-100 rounded-full h-1.5 overflow-hidden"><div class="' + L.bar + ' h-1.5 rounded-full" style="width: ' + pct(p * 20) + '%"></div></div>'
      + '<span class="text-xs font-bold text-slate-400 font-en font-jakarta">' + p + '/5</span></div></div></div>';
  }

  function emptyHero(msg, sub){
    heroBody.innerHTML = '<div class="my-auto text-center space-y-2 py-6">' + heroTitle(msg) + '<p class="text-sm text-blue-600/90 font-bold font-tajawal">' + esc(sub) + '</p></div>';
    cardsSection.classList.add('hidden');
  }

  /* =====================================================
     تبويب «التعليم»: البطاقة الكبيرة + بطاقات الكلمات
     ===================================================== */
  var cur = 0;
  function renderLearn(){
    var w = words[cur], L = lv(w), p = w.progress || 0;
    var sentence = '';
    if (w.example) {
      sentence = '<div class="space-y-1"><p class="text-base sm:text-lg font-semibold text-slate-700 font-en font-jakarta text-left" dir="ltr">' + highlight(w.example, w.word) + '</p>'
        + (w.example_translation ? '<p class="text-sm text-blue-600/90 font-bold font-tajawal">' + esc(w.example_translation) + '</p>' : '') + '</div>';
    }
    heroBody.innerHTML =
      '<div class="flex items-start justify-between flex-row-reverse"><div class="flex items-center gap-4">' + bigWord(w.word) + listenIconBtn(w.word) + '</div>' + pill(L.hero, L) + '</div>'
      + '<div class="my-5 space-y-2">' + heroTitle(w.meaning) + sentence + '</div>'
      + '<div class="flex items-center justify-between pt-2">' + progressPill(p + '/5', p * 20)
      + '<button class="' + BTN_CLS + '" type="button" data-speak="' + esc(w.word) + '"><img alt="Headphones" class="w-6 h-6 object-contain brightness-0 invert" src="' + ICON_HEADPHONES + '"><span class="font-tajawal font-bold">استمع للنطق</span></button></div>';

    var html = '', n = 0;
    words.forEach(function(x, idx){ if (idx !== cur) { html += wordCard(x, idx, true); n++; } });
    cardsGrid.innerHTML = html;
    cardsTitle.textContent = 'جميع الكلمات';
    cardsCount.textContent = n + ' مفردات متاحة';
    cardsSection.classList.toggle('hidden', n === 0);
  }

  document.addEventListener('click', function(e){
    var sp = e.target.closest('[data-speak]');
    if (sp) { e.stopPropagation(); speak(sp.getAttribute('data-speak')); return; }
    var c = e.target.closest('[data-idx]');
    if (c && mode === 'learn') {
      cur = parseInt(c.getAttribute('data-idx'), 10);
      renderLearn();
      hero.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  });
  document.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-idx]')) { e.preventDefault(); e.target.click(); }
  });

  /* =====================================================
     تبويبات «التدريب» و«الاختبار» و«كلمات للمراجعة»
     نفس البطاقة الكبيرة، بمحتوى يناسب وظيفة كل تبويب
     ===================================================== */
  var TYPES = {practice: ['choose', 'listen'], test: ['choose', 'write', 'listen'], review: ['choose', 'write']};
  var PILL = {choose: 'اختر المعنى', listen: 'استمع واختر الكلمة', write: 'اكتب الكلمة'};
  var PROMPT = {choose: 'ما معنى هذه الكلمة؟', listen: 'استمع ثم اختر الكلمة الصحيحة', write: 'اكتب الكلمة بالإنجليزية'};
  var feedbackMode = (mode !== 'test');   // الاختبار: بدون تصحيح فوري
  var order = [], i = 0, score = 0, results = [], phase = 'answer', chosen = null, cur_ok = false;
  var OPT_BASE = 'opt bg-white/80 hover:bg-white border border-blue-200/60 rounded-2xl px-4 py-3 text-base font-bold text-slate-800 shadow-xs transition-all';
  var OPT_SEL  = 'opt bg-blue-100 border border-blue-400 rounded-2xl px-4 py-3 text-base font-bold text-blue-700 shadow-xs transition-all';
  var OPT_OK   = 'opt bg-emerald-100 border border-emerald-300 rounded-2xl px-4 py-3 text-base font-bold text-emerald-800 shadow-xs transition-all';
  var OPT_BAD  = 'opt bg-rose-100 border border-rose-300 rounded-2xl px-4 py-3 text-base font-bold text-rose-800 shadow-xs transition-all';

  function kindOf(){ var t = TYPES[mode]; return t[i % t.length]; }
  function options(w, k){
    var others = shuffle(words.filter(function(x){ return x.id !== w.id; })).slice(0, 3);
    return shuffle(others.concat([w]));
  }
  function setBtn(el, label, enabled){
    el.textContent = label;
    el.classList.toggle('opacity-50', !enabled);
    el.classList.toggle('pointer-events-none', !enabled);
    el.disabled = !enabled;
  }

  function renderQ(){
    if (i >= order.length) return finish();
    var w = order[i], k = kindOf(), L = lv(w), last = (i === order.length - 1);
    phase = 'answer'; chosen = null;

    var wordBlock;
    if (k === 'choose') wordBlock = bigWord(w.word) + listenIconBtn(w.word);
    else if (k === 'listen') wordBlock = bigWord('???') + listenIconBtn(w.word);
    else wordBlock = bigWord(w.meaning, 'font-tajawal');

    var body = '';
    if (k === 'write') {
      body = '<input id="wr" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="..." type="text" class="w-full bg-white border border-slate-200/90 rounded-2xl py-3 px-4 text-base text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-all shadow-sm font-en font-jakarta text-left">';
    } else {
      body = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="opts">';
      options(w, k).forEach(function(o){
        body += '<button type="button" class="' + OPT_BASE + (k === 'listen' ? ' font-en font-jakarta' : '') + '" data-oid="' + o.id + '"' + (k === 'listen' ? ' dir="ltr"' : '') + '>' + esc(k === 'listen' ? o.word : o.meaning) + '</button>';
      });
      body += '</div>';
    }

    heroBody.innerHTML =
      '<div class="flex items-start justify-between flex-row-reverse"><div class="flex items-center gap-4">' + wordBlock + '</div>' + pill(PILL[k], L).replace(L.pill, LV.medium.pill).replace(L.icon, LV.medium.icon) + '</div>'
      + '<div class="my-5 space-y-3">' + heroTitle(PROMPT[k]) + body + '<div id="fb" class="min-h-[28px]"></div></div>'
      + '<div class="flex items-center justify-between pt-2">' + progressPill((i + 1) + '/' + order.length, i * 100 / order.length)
      + '<button id="act" class="' + BTN_CLS + '" type="button"></button></div>';

    var act = document.getElementById('act');
    setBtn(act, k === 'write' ? 'تأكيد' : (last ? 'إنهاء' : 'التالي'), k === 'write');

    if (k === 'write') {
      var inp = document.getElementById('wr'); inp.focus();
      inp.addEventListener('input', function(){ if (phase === 'answer') setBtn(act, feedbackMode ? 'تأكيد' : (last ? 'إنهاء' : 'التالي'), true); });
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); if (!act.disabled) act.click(); } });
      act.onclick = function(){
        if (phase === 'answer') {
          cur_ok = inp.value.trim().toLowerCase() === w.word.toLowerCase();
          if (feedbackMode) { inp.disabled = true; showFeedback(cur_ok, w); phase = 'done'; setBtn(act, last ? 'إنهاء' : 'التالي', true); }
          else next(w);
        } else next(w);
      };
      setBtn(act, feedbackMode ? 'تأكيد' : (last ? 'إنهاء' : 'التالي'), true);
    } else {
      document.querySelectorAll('#opts .opt').forEach(function(b){
        b.addEventListener('click', function(){
          if (phase !== 'answer' && feedbackMode) return;
          var id = parseInt(b.getAttribute('data-oid'), 10);
          if (feedbackMode) {
            cur_ok = (id === w.id); phase = 'done';
            document.querySelectorAll('#opts .opt').forEach(function(x){
              var xid = parseInt(x.getAttribute('data-oid'), 10);
              x.classList.add('pointer-events-none');
              if (xid === w.id) x.className = OPT_OK + (k === 'listen' ? ' font-en font-jakarta pointer-events-none' : ' pointer-events-none');
              else if (xid === id) x.className = OPT_BAD + (k === 'listen' ? ' font-en font-jakarta pointer-events-none' : ' pointer-events-none');
            });
            showFeedback(cur_ok, w);
            setBtn(act, last ? 'إنهاء' : 'التالي', true);
          } else {
            chosen = id; cur_ok = (id === w.id);
            document.querySelectorAll('#opts .opt').forEach(function(x){
              x.className = (parseInt(x.getAttribute('data-oid'), 10) === id ? OPT_SEL : OPT_BASE) + (k === 'listen' ? ' font-en font-jakarta' : '');
            });
            setBtn(act, last ? 'إنهاء' : 'التالي', true);
          }
        });
      });
      act.onclick = function(){ next(w); };
    }
    if (k === 'listen' || (k === 'choose' && feedbackMode)) setTimeout(function(){ speak(w.word); }, 250);
  }

  function showFeedback(ok, w){
    var fb = document.getElementById('fb');
    fb.innerHTML = ok
      ? '<span class="inline-flex items-center gap-2 bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-200/60">إجابة صحيحة ✓</span>'
      : '<div class="space-y-1"><span class="inline-flex items-center gap-2 bg-rose-100 text-rose-700 px-4 py-1.5 rounded-full text-sm font-bold border border-rose-200/60"><span>الصحيح:</span><span class="font-en font-jakarta" dir="ltr">' + esc(w.word) + '</span><span>=</span><span>' + esc(w.meaning) + '</span></span></div>';
    if (w.example) fb.innerHTML += '<p class="text-sm text-blue-600/90 font-bold font-en font-jakarta text-left mt-2" dir="ltr">' + esc(w.example) + '</p>';
  }

  function next(w){
    results.push({id: w.id, ok: cur_ok}); if (cur_ok) score++;
    i++; cur_ok = false; renderQ();
  }

  function finish(){
    var wrong = results.filter(function(r){ return !r.ok; });
    var total = order.length, p = Math.round(score * 100 / total);
    var msg = wrong.length ? 'راجع الكلمات التي أخطأت فيها' : 'ممتاز! أجبت عن كل الكلمات صحيحًا';
    heroBody.innerHTML =
      '<div class="flex items-start justify-between flex-row-reverse"><div class="flex items-center gap-4">' + bigWord(score + '/' + total) + '</div>'
      + pill(p + '%', wrong.length ? LV.medium : LV.easy) + '</div>'
      + '<div class="my-5 space-y-2">' + heroTitle(msg) + '</div>'
      + '<div class="flex items-center justify-between pt-2">' + progressPill(total + '/' + total, 100)
      + '<button id="again" class="' + BTN_CLS + '" type="button">إعادة المحاولة</button></div>';
    document.getElementById('again').onclick = function(){ location.reload(); };

    if (wrong.length) {
      var byId = {}; words.forEach(function(x){ byId[x.id] = x; });
      cardsGrid.innerHTML = wrong.map(function(r){ return wordCard(byId[r.id], 0, false); }).join('');
      cardsTitle.textContent = 'كلمات تحتاج مراجعة';
      cardsCount.textContent = wrong.length + ' مفردات';
      cardsSection.classList.remove('hidden');
    } else cardsSection.classList.add('hidden');

    fetch(recordUrl, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf}, body: JSON.stringify({results: results})});
  }

  /* ---------- تشغيل ---------- */
  if (!words.length) {
    emptyHero(mode === 'review' ? 'لا توجد كلمات للمراجعة حاليًا' : 'لا توجد كلمات متاحة', mode === 'review' ? 'الكلمات التي تخطئ فيها في التدريب أو الاختبار ستظهر هنا' : 'لم يضف المعلم مفردات لهذا الدرس بعد');
  } else if (mode === 'learn') {
    renderLearn();
  } else {
    order = shuffle(words);
    renderQ();
  }
})();
</script>
</body></html>
