{% if page.paginator.num_pages > 1 %}
<div class="flex flex-wrap items-center justify-between gap-3 mt-5 text-sm">
  <span class="text-slate-500">صفحة <b class="num-font">{{ page.number }}</b> من <b class="num-font">{{ page.paginator.num_pages }}</b> — <b class="num-font">{{ page.paginator.count }}</b> نتيجة</span>
  <span class="flex gap-2">
    {% if page.has_previous %}<a class="px-4 py-2 rounded-xl bg-white border border-slate-200 font-bold text-slate-600 no-underline" href="?{{ qs }}page={{ page.previous_page_number }}">السابق</a>{% endif %}
    {% if page.has_next %}<a class="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold no-underline" href="?{{ qs }}page={{ page.next_page_number }}">التالي</a>{% endif %}
  </span>
</div>{% endif %}
